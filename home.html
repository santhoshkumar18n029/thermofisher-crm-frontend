 <!-- Search message -->

    <div id="multipleResults" class="multiple-results"></div>


         <h2>Order Search</h2>
        <section class="crm-section">
           
            <form class="crm-form grid-layout" id="orderSearchForm">
                
                
                
               <div class="form-row">
    <label for="order-num">Order Number</label>

    <input type="text"
           id="order-num"
           name="orderNumber"
           placeholder="e.g. ORD-10023"
           autocomplete="off">

    <div id="orderSuggestions" class="order-suggestions"></div>
</div>
               
                </div>

                <div class="form-row">
                    <label for="po-num">PO Number</label>
                    <input type="text" id="po-num" name="poNumber" placeholder="e.g. PO-88341">
                </div>

                <div class="form-row">
                    <label for="inv-num">Invoice Number</label>
                    <input type="text" id="inv-num" name="invoiceNumber" placeholder="e.g. INV-5542">
                </div>

                <div class="form-row">
                    <label for="quote-num">Quote Number</label>
                    <input type="text" id="quote-num" name="quoteNumber" placeholder="e.g. QT-9901">
                </div>

                <div class="form-row">
                    <label for="acc-num-search">Account Number</label>
                    <input type="text" id="acc-num-search" name="accountNumber" placeholder="e.g. ACC-1249">
                </div>

                <div class="form-row">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" placeholder="e.g. CA, NY, TX">
                </div>

                <div class="form-actions full-width">
                    <button type="submit" class="btn btn-primary">Search Orders</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
            </form>
        </section>
